<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
    <h1 class="text-lg font-bold text-slate-900">Unit Converter</h1>
    <nav class="flex flex-wrap justify-center gap-4">
            <a href="index.html" class=" hover:text-blue-700">Weight</a>
            <a href="distance.html" class=" underline decoration-black underline-offset-8 hover:text-blue-700">Distance</a>
            <a href="temperature.html" class="hover:text-blue-700">Temperature</a>

    </nav>
    </div>
    </header>   

<main class="max-w-5xl mx-auto px-6 py-10">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Miles to Kilometers -->
        <div class="bg-white rounded-2xl shadow-md p-6">
            <h3 class="text-lg font-bold text-slate-900">Distance</h3>
            <p class="text-sm text-slate-500 mt-1">Miles to Kilometers</p>

            <label for="miles-input" class="block text-sm font-medium text-slate-700 mt-5 mb-2">
                Miles
            </label>
            <input
                id="miles-input"
                type="number"
                value="0"
                class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-pink-400 focus:outline-none"
            />

            <button
                id="miles-button"
                class="w-full mt-4 rounded-lg bg-pink-400 px-4 py-2 font-semibold text-white hover:bg-pink-400 transition cursor-pointer"
            >
                Convert
            </button>

            <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
                <p class="text-xs uppercase tracking-wide text-slate-500">Kilometers</p>
                <p id="miles-result" class="text-2xl font-bold text-pink-500 mt-1">0.00</p>
            </div>
        </div>  

        <!-- Kilometers to Miles -->
        <div class="bg-white rounded-2xl shadow-md p-6">
            <h3 class="text-lg font-bold text-slate-900">Distance</h3>
            <p class="text-sm text-slate-500 mt-1">Kilometers to Miles</p>

            <label for="kilometers-input" class="block text-sm font-medium text-slate-700 mt-5 mb-2">
                Kilometers
            </label>
            <input
                id="kilometers-input"
                type="number"
                value="0"
                class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-pink-400 focus:outline-none"
            />

            <button
                id="kilometers-button"
                class="w-full mt-4 rounded-lg bg-pink-400 px-4 py-2 font-semibold text-white hover:bg-pink-400 transition cursor-pointer"
            >
                Convert
            </button>

            <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
                <p class="text-xs uppercase tracking-wide text-slate-500">Miles</p>
                <p id="kilometers-result" class="text-2xl font-bold text-pink-500 mt-1">0.00</p>
            </div>
        </div>

    </div>
</main>
<footer class="bg-white border-t border-slate-200">
        <div class="max-w-5xl mx-auto px-6 py-6 text-center">
            <p class="text-sm text slate-500">
                Built with Tailwind CSS and TypeScript &middot; CPRG 306 Web Development 2
            </p>
        </div>
    </footer>
    <script type="module" src="./main.ts"></script>  
</body>
</html>
