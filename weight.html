<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <!-- Nav Bar -->
    <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
    <h1 class="text-lg font-bold text-slate-900">Unit Converter</h1>
    <nav class="flex flex-wrap justify-center gap-4">
        <a href="weight.html" class=" underline decoration-black underline-offset-8 hover:text-blue-700">Weight</a>
        <a href="index.html" class="  hover:text-blue-700">Distance</a>
        <a href="temperature.html" class="  hover:text-blue-700">Temperature</a>
    </nav>
    </div>
    </header>
    <!-- End -->

    <main class="max-w-5xl mx-auto px-6 pb-16 space-y-6 py-16 ">
        <div class="flex flex-col md:flex-row gap-6">
    <!-- Pounds to kilograms -->
        <div class="bg-white rounded-2xl shadow-md p-6 flex-1">
            <h3 class="text-lg font-bold text-slate-900">Weight</h3>
            <p class="text-sm text-slate-500 mt-1">Pounds To Kilograms</p>
            <label for="lb-input" class="block text-sm font-medium text-slate-700 mt-5 mb-2">
            Pounds
            </label>
            <input
            id="lb-input"
            type="text"
            placeholder="Example: 1 or 1, 2, 3"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900
            focus:border-blue-500 focus:outline-none"
            />
            <button
            id="lb-button"
            class="w-full mt-4 rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white
            hover:bg-blue-700 transition cursor-pointer"
            >
            Convert
            </button>
            <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
            <p class="text-xs uppercase tracking-wide text-slate-500">Kilograms</p>
            <p id="lb-result" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
            </div>
        </div>

    <!-- End -->

    <!--Kilograms to Pounds-->
            <div class="bg-white rounded-2xl shadow-md p-6 flex-1">
                <h3 class="text-lg font-bold text-slate-900">Weight</h3>
                <p class="text-sm text-slate-500 mt-1">Kilograms to pounds</p>
                <label for="kg-input" class="block text-sm font-medium text-slate-700 mt-5 mb-2">
                Kilograms
                </label>
                <input
                id="kg-input"
                type="text"
                placeholder="Example: 1 or 1, 2, 3"
                class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900
                focus:border-blue-500 focus:outline-none"
                />
                <button
                id="kg-button"
                class="w-full mt-4 rounded-lg bg-blue-800 px-4 py-2 font-semibold text-white
                hover:bg-blue-900 transition cursor-pointer"
                >
                Convert
                </button>
                <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
                <p class="text-xs uppercase tracking-wide text-slate-500">Pounds</p>
                <p id="kg-result" class="text-2xl font-bold text-blue-800 mt-1">0.00</p>
                </div>
            </div>
        </div>
    <!-- End -->

    </main>
    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200">
        <div class="max-w-5xl mx-auto px-6 py-6 text-center">
            <p class="text-sm text slate-500">
                Built with Tailwind CSS and TypeScript &middot; CPRG 306 Wed Development 2
            </p>
        </div>
    </footer>

    <script type="module" src="/weight-main.ts"></script>
</body>
</html>
